<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="surface" x1="28" y1="20" x2="228" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27324D"/>
      <stop offset="0.52" stop-color="#151D30"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="edge" x1="38" y1="28" x2="220" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#67DDE0"/>
      <stop offset="1" stop-color="#526B94"/>
    </linearGradient>
    <linearGradient id="paper" x1="72" y1="44" x2="184" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9EEF0"/>
      <stop offset="0.55" stop-color="#86DFE2"/>
      <stop offset="1" stop-color="#B987F2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#030712" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 深色圆角方块背景 -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="#070B13" opacity="0.7" filter="url(#shadow)"/>
  <rect x="16" y="14" width="224" height="224" rx="56" fill="url(#surface)" stroke="url(#edge)" stroke-width="4"/>

  <!-- 便签纸主体（右上角折角） -->
  <path d="M72 60C72 52 78 44 88 44L156 44L184 72L184 180C184 188 180 192 172 192L88 192C78 192 72 186 72 176Z"
        fill="url(#paper)"/>
  <!-- 折角 -->
  <path d="M156 44L184 44L184 72Z" fill="#0B1220" opacity="0.35"/>
  <path d="M156 44L184 72" stroke="#0B1220" stroke-opacity="0.25" stroke-width="3"/>

  <!-- 文字线条 -->
  <rect x="88" y="92" width="84" height="9" rx="4.5" fill="#0B1220" opacity="0.4"/>
  <rect x="88" y="112" width="66" height="9" rx="4.5" fill="#0B1220" opacity="0.3"/>
  <rect x="88" y="132" width="78" height="9" rx="4.5" fill="#0B1220" opacity="0.35"/>
  <rect x="88" y="152" width="50" height="9" rx="4.5" fill="#0B1220" opacity="0.25"/>

  <!-- 停靠底座 -->
  <rect x="88" y="204" width="80" height="12" rx="6" fill="#67DDE0" opacity="0.4"/>

  <!-- 顶部玻璃高光 -->
  <path d="M40 34C70 20 118 20 150 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5" stroke-linecap="round"/>
