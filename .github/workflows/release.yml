name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish self-contained binary
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Publish ${{ matrix.runtime }}
        run: |
          $version = Select-String -Path .\Directory.Build.props -Pattern '<Version>([^<]+)</Version>'
          $ver = $version.Matches[0].Groups[1].Value
          dotnet publish .\src\MemoDock\MemoDock.csproj `
            --configuration Release `
            --runtime ${{ matrix.runtime }} `
            --self-contained true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --source https://api.nuget.org/v3/index.json `
            --output .\publish-out\${{ matrix.runtime }}
          Compress-Archive -Path .\publish-out\${{ matrix.runtime }}\* -DestinationPath .\MemoDock-$ver-${{ matrix.runtime }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: MemoDock-${{ matrix.runtime }}
          path: MemoDock-*-${{ matrix.runtime }}.zip
          if-no-files-found: error

  release:
    name: Create release and upload assets
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: assets
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
