name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish self-contained binary
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Publish ${{ matrix.runtime }}
        run: |
          $version = Select-String -Path .\Directory.Build.props -Pattern '<Version>([^<]+)</Version>'
          $ver = $version.Matches[0].Groups[1].Value
          dotnet publish .\src\MemoDock\MemoDock.csproj `
            --configuration Release `
            --runtime ${{ matrix.runtime }} `
            --self-contained true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --source https://api.nuget.org/v3/index.json `
            --output .\publish-out\${{ matrix.runtime }}
          Compress-Archive -Path .\publish-out\${{ matrix.runtime }}\* -DestinationPath .\MemoDock-$ver-${{ matrix.runtime }}.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            MemoDock-*-${{ matrix.runtime }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
